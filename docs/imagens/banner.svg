<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Esteira de Cortes: cole o link da live e receba Shorts prontos, com IA">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12041f"/>
      <stop offset=".45" stop-color="#3a0b4d"/>
      <stop offset=".78" stop-color="#8a1a62"/>
      <stop offset="1" stop-color="#ff6a7a"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0846"/>
      <stop offset="1" stop-color="#0b0418"/>
    </linearGradient>
    <filter id="brilho" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="metade-de-baixo"><rect x="740" y="262" width="260" height="140"/></clipPath>
    <mask id="faixas-do-sol">
      <rect x="700" y="100" width="340" height="300" fill="#fff"/>
      <g clip-path="url(#metade-de-baixo)">
        <g class="faixas" fill="#000">
          <rect x="740" y="262" width="260" height="5"/>
          <rect x="740" y="280" width="260" height="7"/>
          <rect x="740" y="300" width="260" height="9"/>
          <rect x="740" y="322" width="260" height="11"/>
          <rect x="740" y="346" width="260" height="13"/>
          <rect x="740" y="372" width="260" height="15"/>
          <rect x="740" y="398" width="260" height="17"/>
        </g>
      </g>
    </mask>
    <clipPath id="recorte-chao"><rect x="0" y="290" width="1200" height="110"/></clipPath>
    <clipPath id="digitando">
      <rect x="60" y="238" width="0" height="40">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;.32;.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <symbol id="palmeira" viewBox="0 0 120 200">
      <path d="M58 200 C57 160 55 118 63 72 L69 72 C62 118 64 160 66 200 Z"/>
      <path d="M66 72 C44 50 22 52 2 70 C26 58 46 62 66 80 Z"/>
      <path d="M66 72 C90 48 110 50 120 66 C98 58 82 62 66 80 Z"/>
      <path d="M66 74 C52 42 36 28 16 26 C38 36 50 52 62 80 Z"/>
      <path d="M66 74 C80 40 96 26 114 24 C94 34 82 52 70 80 Z"/>
      <path d="M66 74 C66 46 62 26 52 12 C68 26 72 48 70 80 Z"/>
    </symbol>
  </defs>
  <style>
    .estrela { animation: piscar 3.2s ease-in-out infinite; }
    @keyframes piscar { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .faixas { animation: subir 3.5s linear infinite; }
    @keyframes subir { from { transform: translateY(0); } to { transform: translateY(-20px); } }
    .linhas { animation: andar 1.4s linear infinite; }
    @keyframes andar { from { transform: translateY(0); } to { transform: translateY(20px); } }
    .titulo { animation: neon 7s linear infinite; }
    @keyframes neon { 0%, 90%, 92%, 95%, 100% { opacity: 1; } 91% { opacity: .45; } 94% { opacity: .7; } }
    .aura-sol { animation: pulsar 4s ease-in-out infinite alternate; }
    @keyframes pulsar { from { opacity: .45; } to { opacity: .8; } }
    .balanco { transform-box: fill-box; transform-origin: 50% 100%; animation: balancar 5s ease-in-out infinite alternate; }
    @keyframes balancar { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="400" fill="url(#ceu)"/>

  <g fill="#fff">
    <circle class="estrela" cx="80" cy="40" r="1.6"/>
    <circle class="estrela" cx="210" cy="78" r="1.2" style="animation-delay:-1.1s"/>
    <circle class="estrela" cx="330" cy="30" r="1.8" style="animation-delay:-2.3s"/>
    <circle class="estrela" cx="455" cy="92" r="1.1" style="animation-delay:-.6s"/>
    <circle class="estrela" cx="560" cy="48" r="1.5" style="animation-delay:-1.8s"/>
    <circle class="estrela" cx="660" cy="22" r="1.2" style="animation-delay:-2.9s"/>
    <circle class="estrela" cx="720" cy="86" r="1.7" style="animation-delay:-.3s"/>
    <circle class="estrela" cx="820" cy="40" r="1.3" style="animation-delay:-1.5s"/>
    <circle class="estrela" cx="930" cy="70" r="1.9" style="animation-delay:-2.1s"/>
    <circle class="estrela" cx="1040" cy="30" r="1.2" style="animation-delay:-.9s"/>
    <circle class="estrela" cx="1130" cy="96" r="1.6" style="animation-delay:-2.6s"/>
    <circle class="estrela" cx="1170" cy="44" r="1.1" style="animation-delay:-1.3s"/>
    <circle class="estrela" cx="600" cy="120" r="1" style="animation-delay:-3s"/>
    <circle class="estrela" cx="1010" cy="128" r="1" style="animation-delay:-.5s"/>
  </g>

  <circle class="aura-sol" cx="870" cy="270" r="150" fill="#ff5e7e" filter="url(#aura)"/>
  <circle cx="870" cy="270" r="120" fill="url(#sol)" mask="url(#faixas-do-sol)"/>

  <g fill="#160427">
    <use class="balanco" href="#palmeira" x="1010" y="120" width="130" height="217"/>
    <use class="balanco" href="#palmeira" x="1100" y="160" width="100" height="167" style="animation-delay:-2s"/>
    <use class="balanco" href="#palmeira" x="-30" y="170" width="95" height="158" style="animation-delay:-3s"/>
  </g>

  <rect x="0" y="290" width="1200" height="110" fill="url(#chao)"/>
  <g clip-path="url(#recorte-chao)" stroke="#19e3d6" stroke-opacity=".55" stroke-width="1.5">
    <g class="linhas">
      <line x1="0" y1="290" x2="1200" y2="290"/>
      <line x1="0" y1="310" x2="1200" y2="310"/>
      <line x1="0" y1="330" x2="1200" y2="330"/>
      <line x1="0" y1="350" x2="1200" y2="350"/>
      <line x1="0" y1="370" x2="1200" y2="370"/>
      <line x1="0" y1="390" x2="1200" y2="390"/>
      <line x1="0" y1="410" x2="1200" y2="410"/>
    </g>
    <line x1="600" y1="290" x2="-600" y2="400"/>
    <line x1="600" y1="290" x2="-200" y2="400"/>
    <line x1="600" y1="290" x2="150" y2="400"/>
    <line x1="600" y1="290" x2="420" y2="400"/>
    <line x1="600" y1="290" x2="600" y2="400"/>
    <line x1="600" y1="290" x2="780" y2="400"/>
    <line x1="600" y1="290" x2="1050" y2="400"/>
    <line x1="600" y1="290" x2="1400" y2="400"/>
    <line x1="600" y1="290" x2="1800" y2="400"/>
  </g>
  <line x1="0" y1="290" x2="1200" y2="290" stroke="#ff2d95" stroke-width="2" filter="url(#brilho)"/>

  <g class="titulo" transform="skewX(-8)" font-family="'Arial Black', 'Arial Bold', Impact, 'Helvetica Neue', sans-serif" font-weight="900" font-style="italic" fill="url(#neon)" filter="url(#brilho)">
    <text x="92" y="132" font-size="84" textLength="560" lengthAdjust="spacingAndGlyphs">ESTEIRA DE</text>
    <text x="80" y="218" font-size="84" textLength="420" lengthAdjust="spacingAndGlyphs">CORTES</text>
  </g>

  <g clip-path="url(#digitando)">
    <text x="62" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#ffe9f6" textLength="600" lengthAdjust="spacingAndGlyphs">Cole o link da live. Receba Shorts prontos, com IA.</text>
  </g>
  <rect class="cursor" x="60" y="244" width="3" height="28" fill="#ffd23f">
    <animate attributeName="x" values="60;700;700;60" keyTimes="0;.32;.9;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffe9f6" fill-opacity=".85">
    <text x="62" y="372">TWITCH · KICK · YOUTUBE  ➜  SHORTS PRONTOS NO SEU CANAL</text>
  </g>
</svg>
