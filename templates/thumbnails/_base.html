<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>thumbnail</title>
<style>
{{ tema.css_fontes|safe }}
:root {
  --fundo: {{ tema.paleta.fundo }};
  --primaria: {{ tema.paleta.primaria }};
  --secundaria: {{ tema.paleta.secundaria }};
  --texto: {{ tema.paleta.texto }};
  --fonte-titulo: {{ tema.fonte_titulos_css|safe }};
  --fonte-corpo: {{ tema.fonte_corpo_css|safe }};
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--fundo); }
body { font-family: var(--fonte-corpo); color: #fff; -webkit-font-smoothing: antialiased; }
.tela { position: absolute; inset: 0; overflow: hidden; }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.3) contrast(1.15) brightness(1.02); }
.frase { font-family: var(--fonte-titulo); text-transform: uppercase; line-height: .94; letter-spacing: -.005em; }
.frase .realce { color: var(--secundaria); }
.selo { position: absolute; font-weight: 800; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 16px; border-radius: 8px; background: rgba(0,0,0,.6); color: #fff; }
{% block estilo %}{% endblock %}
</style>
</head>
<body>
<div class="tela">{% block conteudo %}{% endblock %}</div>
<script>
const DADOS = {{ dados|tojson }};
const TEMA = {{ tema_js|tojson }};
{% include "cenas/_motor.js" %}
{% block script %}{% endblock %}
</script>
</body>
</html>
