<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>cena</title>
<style>
{{ tema.css_fontes|safe }}
:root {
  --fundo: {{ tema.paleta.fundo }};
  --primaria: {{ tema.paleta.primaria }};
  --secundaria: {{ tema.paleta.secundaria }};
  --texto: {{ tema.paleta.texto }};
  --texto-suave: {{ tema.paleta.texto_suave }};
  --fonte-titulo: {{ tema.fonte_titulos_css|safe }};
  --fonte-corpo: {{ tema.fonte_corpo_css|safe }};
  --w: {{ largura }}px;
  --h: {{ altura }}px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); overflow: hidden; }
body {
  background: {% if transparente %}transparent{% else %}var(--fundo){% endif %};
  color: var(--texto); font-family: var(--fonte-corpo); -webkit-font-smoothing: antialiased;
}
.palco { position: absolute; inset: 0; overflow: hidden; }
.fundo { position: absolute; inset: -10%; }
.estilo-explicativo .fundo {
  background:
    radial-gradient(1200px 800px at 18% 12%, color-mix(in srgb, var(--primaria) 30%, transparent), transparent 62%),
    radial-gradient(900px 700px at 88% 92%, color-mix(in srgb, var(--secundaria) 18%, transparent), transparent 60%),
    var(--fundo);
}
.estilo-documentario .fundo {
  background: radial-gradient(1500px 950px at 50% 38%, color-mix(in srgb, var(--primaria) 16%, var(--fundo)), var(--fundo) 72%);
}
.estilo-animacao_2d .fundo {
  background: linear-gradient(160deg, color-mix(in srgb, var(--primaria) 38%, var(--fundo)), var(--fundo) 72%);
}
.estilo-tipografia .fundo { background: var(--fundo); }
.grade {
  position: absolute; inset: -200px; opacity: .35;
  background-image: radial-gradient(color-mix(in srgb, var(--texto) 16%, transparent) 2px, transparent 2.6px);
  background-size: 48px 48px; animation: deriva 30s linear infinite both;
}
.estilo-tipografia .grade, .estilo-documentario .grade { display: none; }
.grao { position: absolute; inset: 0; opacity: .035; background-image: url("{{ tema.grao }}"); background-size: 160px 160px; }
.estilo-documentario .grao { opacity: .06; }
.vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
.estilo-tipografia .vinheta { display: none; }
.anim { animation-duration: .8s; animation-timing-function: cubic-bezier(.2,.8,.2,1); animation-fill-mode: both; }
.palavra { display: inline-block; }
@keyframes deriva { to { transform: translate(-96px, -96px); } }
@keyframes subir { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
@keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
@keyframes crescerX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes crescerY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes zoomEntrada { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
@keyframes deslizarEsq { from { opacity: 0; transform: translateX(-90px); } to { opacity: 1; transform: none; } }
@keyframes respirar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
{% block estilo %}{% endblock %}
</style>
</head>
<body class="estilo-{{ tema.estilo }}">
<div class="palco">
{% block fundo %}<div class="fundo"></div><div class="grade"></div><div class="grao"></div><div class="vinheta"></div>{% endblock %}
{% block conteudo %}{% endblock %}
</div>
<script>
const DADOS = {{ dados|tojson }};
const TEMA = {{ tema_js|tojson }};
{% include "cenas/_motor.js" %}
{% block script %}{% endblock %}
</script>
</body>
</html>
